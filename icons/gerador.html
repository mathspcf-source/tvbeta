<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Ícones - LotoFácil</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0a0a;
    color: #fff;
    padding: 40px 20px;
    text-align: center;
    min-height: 100vh;
  }
  h1 { font-weight: 200; letter-spacing: .05em; margin-bottom: 8px; }
  h1 b { font-weight: 600; color: #ffb900; }
  p { color: #a0a0a0; font-size: .85rem; margin-bottom: 32px; }
  .previews {
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .preview canvas {
    border: 2px solid #2b2b2b;
    display: block;
  }
  .preview .label {
    font-size: .7rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: #a0a0a0;
  }
  .btn {
    background: #ffb900;
    color: #000;
    border: none;
    padding: 14px 32px;
    font-family: inherit;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    margin: 4px;
  }
  .btn:active { transform: scale(.97); }
  .btn.outline {
    background: transparent;
    color: #ffb900;
    border: 1px solid #ffb900;
  }
  .hint {
    margin-top: 24px;
    font-size: .75rem;
    color: #666;
    line-height: 1.6;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .hint b { color: #ffb900; }
</style>
</head>
<body>

<h1>Loto<b>Fácil</b></h1>
<p>Gerador de ícones PWA</p>

<div class="previews">
  <div class="preview">
    <canvas id="c512" width="512" height="512" style="width:256px;height:256px;"></canvas>
    <div class="label">512 × 512</div>
  </div>
  <div class="preview">
    <canvas id="c192" width="192" height="192" style="width:128px;height:128px;"></canvas>
    <div class="label">192 × 192</div>
  </div>
</div>

<button class="btn" onclick="baixar(512)">Baixar 512×512</button>
<button class="btn" onclick="baixar(192)">Baixar 192×192</button>
<button class="btn outline" onclick="baixarAmbos()">Baixar ambos</button>

<div class="hint">
  Salve os arquivos como <b>icon-512.png</b> e <b>icon-192.png</b>
  dentro da pasta <b>icons/</b> do seu projeto.
</div>

<script>
  function desenhar(canvas, size) {
    const ctx = canvas.getContext('2d');
    const s = size / 512; // escala baseada em 512

    // Fundo preto
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, size, size);

    // Borda dourada sutil
    ctx.strokeStyle = '#ffb900';
    ctx.lineWidth = 4 * s;
    ctx.strokeRect(20 * s, 20 * s, size - 40 * s, size - 40 * s);

    // Trevo grande central
    ctx.font = `${280 * s}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍀', size / 2, size * 0.42);

    // Texto "LF" embaixo
    ctx.fillStyle = '#ffb900';
    ctx.font = `200 ${110 * s}px "Segoe UI", -apple-system, sans-serif`;
    ctx.fillText('LF', size / 2, size * 0.78);

    // Linha decorativa
    ctx.strokeStyle = '#ffb900';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    ctx.moveTo(size * 0.35, size * 0.68);
    ctx.lineTo(size * 0.65, size * 0.68);
    ctx.stroke();

    // Pequenos pontos (estética casino)
    ctx.fillStyle = '#ffb900';
    const dotSize = 3 * s;
    const posicoes = [
      [size * 0.25, size * 0.25],
      [size * 0.75, size * 0.25],
      [size * 0.25, size * 0.88],
      [size * 0.75, size * 0.88],
    ];
    posicoes.forEach(([x, y]) => {
      ctx.beginPath();
      ctx.arc(x, y, dotSize, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function baixar(size) {
    const canvas = document.getElementById('c' + size);
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `icon-${size}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  }

  function baixarAmbos() {
    baixar(512);
    setTimeout(() => baixar(192), 300);
  }

  // Renderiza previews
  desenhar(document.getElementById('c512'), 512);
  desenhar(document.getElementById('c192'), 192);
</script>

</body>
</html>
