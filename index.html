<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Reprodutor IPTV M3U" />
  <title>IPTV Player</title>

  <link rel="stylesheet" href="./assets/css/styles.css" />

  <!-- hls.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">
      <header class="sidebar__header">
        <h1 class="sidebar__title">📺 IPTV Player</h1>
        <div class="sidebar__status" id="statusBar">
          <span class="spinner" id="spinner"></span>
          <span id="statusText">Carregando...</span>
        </div>
      </header>

      <div class="sidebar__search">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Buscar canal..."
          autocomplete="off"
        />
      </div>

      <nav class="sidebar__list" id="channelList">
        <div class="empty">Aguardando carregamento...</div>
      </nav>
    </aside>

    <!-- ========== PLAYER ========== -->
    <main class="player">
      <div class="player__video-wrap">
        <video
          id="video"
          controls
          playsinline
          preload="metadata"
        ></video>

        <div class="player__placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor">
            <path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/>
          </svg>
          <p>Selecione um canal para começar</p>
        </div>

        <div class="player__error" id="errorBox"></div>
      </div>

      <footer class="player__bar">
        <span class="dot" id="liveDot"></span>
        <span class="player__now" id="nowPlaying">Nenhum canal selecionado</span>
      </footer>
    </main>
  </div>

  <!-- Scripts na ordem correta -->
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <script src="./assets/js/parser.js"></script>
  <script src="./assets/js/player.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
